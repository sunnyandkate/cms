name: CMS Server Deployment

on:
  push:
    branches:
      - main  

jobs:
  web-deploy:
    name: Sync CMS to Subfolder
    runs-on: ubuntu-latest
    steps:
    - name: Fetch latest repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Deploy files via FTP Action
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
       
        server-dir: public_html/projects/cms/
